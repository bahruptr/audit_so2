```html
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuditStock Pro Workspace</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel compiler for inline JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- XLSX Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const INITIAL_MASTER_STOCK = [
      { id: '1', name: 'Sepatu Running Speed', color: 'Merah', size: '42', skuInduk: 'SKU-RUN-SPD', sku: 'SKU-RUN-SPD-RED-42', salesPerMonth: 120, movingCategory: 'Fast Moving', price: 550000, priceCategory: 'Medium Value', zone: 'Zona A1', systemQty: 120, conversionRatio: 50 },
      { id: '2', name: 'Tas BackPack Travel', color: 'Hitam', size: '30L', skuInduk: 'SKU-BAG-TRV', sku: 'SKU-BAG-TRV-BLK-30L', salesPerMonth: 15, movingCategory: 'Slow Moving', price: 1850000, priceCategory: 'High Value', zone: 'Zona A2', systemQty: 250, conversionRatio: 50 },
      { id: '3', name: 'Lemari Jati Jepara', color: 'Cokelat', size: '1x2m', skuInduk: 'Lemari Jati', sku: 'lemari-jati-coklat-2m', salesPerMonth: 275, movingCategory: 'Fast Moving', price: 2000000, priceCategory: 'High Value', zone: 'Zona B1', systemQty: 500, conversionRatio: 10 }
    ];

    const INITIAL_TODOS = [
      { id: 't1', title: 'Audit Fisik Sepatu Sneaker RAK A1-A3', description: 'Cek fisik dan pastikan label barcode sesuai', period: 'Harian', priority: 'High', zone: 'Zona A1', dueDate: '2026-11-08', completed: false },
      { id: 't2', title: 'Verifikasi Stok Karungan Kaos Kaki', description: 'Pastikan 1 Karung isi tepat 100 Pcs', period: 'Mingguan', priority: 'Medium', zone: 'Zona B1', dueDate: '2026-11-12', completed: true },
      { id: 't3', title: 'Opname Total Area Bulk Gudang C', description: 'Rekonsiliasi akhir bulan barang berat', period: 'Bulanan', priority: 'High', zone: 'Zona C3', dueDate: '2026-11-30', completed: false }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('opname');
      const [masterStock, setMasterStock] = useState(INITIAL_MASTER_STOCK);
      const [auditLogs, setAuditLogs] = useState([]);
      const [todos, setTodos] = useState(INITIAL_TODOS);
      const [importMode, setImportMode] = useState('master');

      const [isProcessingFile, setIsProcessingFile] = useState(false);
      const [uploadProgress, setUploadProgress] = useState(0);
      const [uploadStatusMsg, setUploadStatusMsg] = useState('');
      const [uploadSuccess, setUploadSuccess] = useState(null);

      const [selectedZone, setSelectedZone] = useState('Zona A1');
      const [customZone, setCustomZone] = useState('');
      const [skuInput, setSkuInput] = useState('');
      const [selectedSkuObj, setSelectedSkuObj] = useState(null);
      const [inputQty, setInputQty] = useState('');
      const [unit, setUnit] = useState('Pcs');
      const [conversionRatio, setConversionRatio] = useState(50);
      const [auditorNote, setAuditorNote] = useState('');
      const [showSuggestions, setShowSuggestions] = useState(false);

      const [todoPeriod, setTodoPeriod] = useState('Harian');
      const [newTodoTitle, setNewTodoTitle] = useState('');
      const [newTodoDesc, setNewTodoDesc] = useState('');
      const [newTodoPriority, setNewTodoPriority] = useState('Medium');
      const [newTodoDueDate, setNewTodoDueDate] = useState('');
      const [showAddTodoModal, setShowAddTodoModal] = useState(false);

      const defaultZones = ['Zona A1', 'Zona A2', 'Zona B1', 'Zona B2', 'Zona C1', 'Zona C3', 'Bulk Area', 'Lainnya...'];

      const handleSelectSku = (item) => {
        setSkuInput(item.sku);
        setSelectedSkuObj(item);
        setConversionRatio(item.conversionRatio || 50);
        setShowSuggestions(false);
      };

      const skuSuggestions = useMemo(() => {
        if (!skuInput.trim()) return [];
        const query = skuInput.toLowerCase();
        return masterStock.filter(item => item.sku.toLowerCase().includes(query) || item.name.toLowerCase().includes(query));
      }, [skuInput, masterStock]);

      const convertedValues = useMemo(() => {
        const qty = parseFloat(inputQty) || 0;
        const ratio = parseFloat(conversionRatio) || 1;
        if (unit === 'Karung') {
          return { pcs: qty * ratio, karung: qty, displayText: `${qty} Karung = ${(qty * ratio).toLocaleString()} Pcs (${ratio} Pcs/Karung)` };
        } else {
          return { pcs: qty, karung: qty / ratio, displayText: `${qty} Pcs = ${(qty / ratio).toFixed(2)} Karung (${ratio} Pcs/Karung)` };
        }
      }, [inputQty, unit, conversionRatio]);

      const handleAddAuditLog = (e) => {
        e.preventDefault();
        if (!skuInput || !inputQty || parseFloat(inputQty) <= 0) {
          alert('Mohon isi SKU dan Jumlah Qty yang valid!');
          return;
        }
        const zoneToSave = selectedZone === 'Lainnya...' ? customZone : selectedZone;
        const activeSkuObj = selectedSkuObj || { sku: skuInput, name: 'SKU Non-Master / Item Baru', systemQty: 0 };

        const newLog = {
          id: Date.now().toString(),
          timestamp: new Date().toLocaleString('id-ID'),
          zone: zoneToSave || 'Zona General',
          sku: activeSkuObj.sku,
          name: activeSkuObj.name,
          inputQty: parseFloat(inputQty),
          unit: unit,
          pcsQty: convertedValues.pcs,
          karungQty: convertedValues.karung,
          conversionRatio: parseFloat(conversionRatio),
          systemQty: activeSkuObj.systemQty || 0,
          note: auditorNote
        };

        setAuditLogs([newLog, ...auditLogs]);
        setSkuInput('');
        setSelectedSkuObj(null);
        setInputQty('');
        setAuditorNote('');
      };

      const handleDeleteAuditLog = (id) => {
        setAuditLogs(auditLogs.filter(log => log.id !== id));
      };

      const reconciliationData = useMemo(() => {
        const physicalCounts = {};
        auditLogs.forEach(log => {
          physicalCounts[log.sku] = (physicalCounts[log.sku] || 0) + log.pcsQty;
        });

        const items = masterStock.map(stock => {
          const physicalQty = physicalCounts[stock.sku] || 0;
          const discrepancyPcs = physicalQty - stock.systemQty;
          const ratio = stock.conversionRatio || 50;
          const discrepancyKarung = discrepancyPcs / ratio;
          let status = 'MATCHED';
          if (discrepancyPcs > 0) status = 'OVERSTOCK';
          if (discrepancyPcs < 0) status = 'SHORTAGE';
          return { ...stock, physicalQty, discrepancyPcs, discrepancyKarung, status };
        });

        const totalAuditedPcs = Object.values(physicalCounts).reduce((a, b) => a + b, 0);
        const totalSystemPcs = masterStock.reduce((a, b) => a + (b.systemQty || 0), 0);
        const netDiscrepancy = totalAuditedPcs - totalSystemPcs;
        const totalDiscrepanciesCount = items.filter(i => i.discrepancyPcs !== 0).length;

        return { items, totalAuditedPcs, totalSystemPcs, netDiscrepancy, totalDiscrepanciesCount };
      }, [masterStock, auditLogs]);

      const handleAddTodo = (e) => {
        e.preventDefault();
        if (!newTodoTitle.trim()) return;
        const newTask = {
          id: Date.now().toString(),
          title: newTodoTitle,
          description: newTodoDesc,
          period: todoPeriod,
          priority: newTodoPriority,
          zone: 'Zona A1',
          dueDate: newTodoDueDate || new Date().toISOString().split('T')[0],
          completed: false
        };
        setTodos([newTask, ...todos]);
        setNewTodoTitle('');
        setNewTodoDesc('');
        setShowAddTodoModal(false);
      };

      const toggleTodo = (id) => {
        setTodos(todos.map(t => t.id === id ? { ...t, completed: !t.completed } : t));
      };

      const handleDeleteTodo = (id) => {
        setTodos(todos.filter(t => t.id !== id));
      };

      const filteredTodos = useMemo(() => todos.filter(t => t.period === todoPeriod), [todos, todoPeriod]);

      const downloadNativeExcel = (sheetName, headers, rows, filename) => {
        try {
          if (!window.XLSX) {
            alert('Pustaka Excel sedang dimuat...');
            return;
          }
          const aoaData = [headers, ...rows];
          const worksheet = window.XLSX.utils.aoa_to_sheet(aoaData);
          const workbook = window.XLSX.utils.book_new();
          window.XLSX.utils.book_append_sheet(workbook, worksheet, sheetName);
          window.XLSX.writeFile(workbook, filename);
        } catch (err) {
          alert('Gagal mengunduh file Excel: ' + err.message);
        }
      };

      const handleDownloadMasterTemplate = () => {
        const headers = ['No', 'Nama Produk', 'Variasi Warna', 'Variasi Ukuran', 'SKU Induk', 'SKU Variasi', 'Sales Rata2 / Bulan', 'Kategori Moving Barang', 'Harga Barang', 'Kategori Harga Barang'];
        const rows = [
          [1, 'Sepatu Running Speed', 'Merah', '42', 'SKU-RUN-SPD', 'SKU-RUN-SPD-RED-42', 120, 'Fast Moving', 550000, 'Medium Value'],
          [2, 'Tas BackPack Travel', 'Hitam', '30L', 'SKU-BAG-TRV', 'SKU-BAG-TRV-BLK-30L', 15, 'Slow Moving', 1850000, 'High Value'],
          [3, 'Lemari Jati Jepara', 'Cokelat', '1x2m', 'Lemari Jati', 'lemari-jati-coklat-2m', 275, 'Fast Moving', 2000000, 'High Value']
        ];
        downloadNativeExcel('Master Data', headers, rows, 'Template_Master_Data.xlsx');
      };

      const handleDownloadQtyTemplate = () => {
        const headers = ['No', 'SKU Variasi', 'Qty System', 'Isi Per Karung'];
        const rows = masterStock.map((item, index) => [index + 1, item.sku, item.systemQty || 0, item.conversionRatio || 50]);
        downloadNativeExcel('Qty System', headers, rows, 'Template_Qty_Stok.xlsx');
      };

      const handleExportToExcel = () => {
        if (auditLogs.length === 0) {
          alert('Belum ada data opname fisik untuk diexport!');
          return;
        }
        const headers = ['No', 'Waktu Audit', 'Zona / Lokasi', 'Kode SKU Variasi', 'Nama Produk', 'Qty Input Physical', 'Satuan Input', 'Rasio Konversi (Pcs/Karung)', 'Physical Qty (Pcs)', 'Physical Qty (Karung)', 'System Qty (Pcs)', 'Selisih (Pcs)', 'Selisih (Karung)', 'Catatan Auditor'];
        const rows = auditLogs.map((log, index) => {
          const systemQty = log.systemQty || 0;
          const selisihPcs = log.pcsQty - systemQty;
          const selisihKarung = parseFloat((selisihPcs / (log.conversionRatio || 50)).toFixed(2));
          return [index + 1, log.timestamp, log.zone, log.sku, log.name, log.inputQty, log.unit, log.conversionRatio, log.pcsQty, parseFloat(log.karungQty.toFixed(2)), systemQty, selisihPcs, selisihKarung, log.note || '-'];
        });
        downloadNativeExcel('Hasil Opname', headers, rows, `Hasil_Stock_Opname_${new Date().toISOString().split('T')[0]}.xlsx`);
      };

      const cleanKey = (key) => key ? String(key).trim().toLowerCase().replace(/[^a-z0-9]/g, '') : '';
      const parseNumber = (val) => {
        if (typeof val === 'number') return val;
        if (!val) return 0;
        const cleaned = String(val).replace(/\./g, '').replace(/,/g, '.').replace(/[^0-9.-]/g, '');
        return parseFloat(cleaned) || 0;
      };

      const handleFileUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        setIsProcessingFile(true);
        setUploadProgress(30);
        setUploadStatusMsg('Membaca file Excel...');
        const reader = new FileReader();
        reader.onload = (evt) => {
          try {
            const data = new Uint8Array(evt.target.result);
            const workbook = window.XLSX.read(data, { type: 'array', cellDates: true });
            const firstSheetName = workbook.SheetNames[0];
            const json = window.XLSX.utils.sheet_to_json(workbook.Sheets[firstSheetName], { defval: '', raw: false });
            
            let updatedMaster = [...masterStock];
            if (importMode === 'master') {
              json.forEach((row, idx) => {
                const findValue = (names) => {
                  const cleanedNames = names.map(cleanKey);
                  for (const k of Object.keys(row)) {
                    if (cleanedNames.includes(cleanKey(k))) return row[k];
                  }
                  return '';
                };
                const sku = String(findValue(['SKU Variasi', 'SKU'])).trim();
                if (!sku) return;
                const name = String(findValue(['Nama Produk', 'NamaBarang']) || 'Barang Baru').trim();
                const color = String(findValue(['Variasi Warna', 'Warna']) || '-').trim();
                const size = String(findValue(['Variasi Ukuran', 'Ukuran']) || '-').trim();
                const skuInduk = String(findValue(['SKU Induk']) || '-').trim();
                const sales = parseNumber(findValue(['Sales Rata2 / Bulan', 'Sales']));
                const movingCategory = String(findValue(['Kategori Moving Barang', 'Kategori Moving']) || 'Medium Moving').trim();
                const price = parseNumber(findValue(['Harga Barang', 'Harga']));
                const priceCategory = String(findValue(['Kategori Harga Barang']) || 'Medium Value').trim();

                const existingIndex = updatedMaster.findIndex(item => item.sku.toLowerCase() === sku.toLowerCase());
                const newItem = { id: existingIndex >= 0 ? updatedMaster[existingIndex].id : 'sku-' + Date.now() + '-' + idx, name, color, size, skuInduk, sku, salesPerMonth: sales, movingCategory, price, priceCategory, zone: 'Zona A1', systemQty: existingIndex >= 0 ? updatedMaster[existingIndex].systemQty : 0, conversionRatio: 50 };
                if (existingIndex >= 0) updatedMaster[existingIndex] = { ...updatedMaster[existingIndex], ...newItem };
                else updatedMaster.push(newItem);
              });
              setMasterStock(updatedMaster);
            } else {
              json.forEach((row) => {
                const findValue = (names) => {
                  const cleanedNames = names.map(cleanKey);
                  for (const k of Object.keys(row)) {
                    if (cleanedNames.includes(cleanKey(k))) return row[k];
                  }
                  return '';
                };
                const sku = String(findValue(['SKU Variasi', 'SKU'])).trim();
                if (!sku) return;
                const newQty = parseNumber(findValue(['Qty System', 'Qty']));
                const ratio = parseNumber(findValue(['Isi Per Karung', 'Rasio'])) || 50;
                const existingIndex = updatedMaster.findIndex(item => item.sku.toLowerCase() === sku.toLowerCase());
                if (existingIndex >= 0) {
                  updatedMaster[existingIndex].systemQty = newQty;
                  updatedMaster[existingIndex].conversionRatio = ratio;
                } else {
                  updatedMaster.push({ id: 'qty-' + Date.now(), name: 'Item (' + sku + ')', color: '-', size: '-', skuInduk: '-', sku, salesPerMonth: 0, movingCategory: 'Medium Moving', price: 0, priceCategory: 'Medium Value', zone: 'Zona A1', systemQty: newQty, conversionRatio: ratio });
                }
              });
              setMasterStock(updatedMaster);
            }
            setUploadProgress(100);
            setUploadStatusMsg('Import Selesai!');
            setUploadSuccess(true);
            setTimeout(() => setIsProcessingFile(false), 1000);
          } catch (err) {
            setUploadProgress(100);
            setUploadStatusMsg('Gagal membaca file.');
            setUploadSuccess(false);
          }
        };
        reader.readAsArrayBuffer(file);
        e.target.value = '';
      };

      return (
        <div className="min-h-screen bg-slate-900 text-slate-100 font-sans antialiased flex flex-col">
          <header className="sticky top-0 z-40 bg-slate-950 border-b border-slate-800 shadow-xl">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-16">
                <div className="flex items-center space-x-3">
                  <div className="p-2 bg-gradient-to-tr from-blue-600 to-indigo-500 rounded-xl shadow-lg">
                    <svg className="w-6 h-6 text-white" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
                  </div>
                  <div>
                    <h1 className="text-lg font-bold text-white">AuditStock Pro</h1>
                    <p className="text-xs text-slate-400">Sistem Opname & Rekonsiliasi Stok Digital</p>
                  </div>
                </div>

                <nav className="flex space-x-1 sm:space-x-2">
                  <button onClick={() => setActiveTab('opname')} className={`px-3 py-2 rounded-lg text-xs sm:text-sm font-medium ${activeTab === 'opname' ? 'bg-blue-600 text-white shadow-md shadow-blue-600/30' : 'text-slate-300 hover:bg-slate-800'}`}>Opname</button>
                  <button onClick={() => setActiveTab('todos')} className={`px-3 py-2 rounded-lg text-xs sm:text-sm font-medium ${activeTab === 'todos' ? 'bg-blue-600 text-white shadow-md shadow-blue-600/30' : 'text-slate-300 hover:bg-slate-800'}`}>To-Do</button>
                  <button onClick={() => setActiveTab('dashboard')} className={`px-3 py-2 rounded-lg text-xs sm:text-sm font-medium ${activeTab === 'dashboard' ? 'bg-blue-600 text-white shadow-md shadow-blue-600/30' : 'text-slate-300 hover:bg-slate-800'}`}>Dashboard</button>
                  <button onClick={() => setActiveTab('export')} className={`px-3 py-2 rounded-lg text-xs sm:text-sm font-medium ${activeTab === 'export' ? 'bg-blue-600 text-white shadow-md shadow-blue-600/30' : 'text-slate-300 hover:bg-slate-800'}`}>Import & Laporan</button>
                </nav>
              </div>
            </div>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
            {activeTab === 'opname' && (
              <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <div className="lg:col-span-5 bg-slate-800/90 border border-slate-700/80 rounded-2xl p-5 shadow-xl">
                  <h2 className="text-base font-semibold text-white mb-4">Form Audit Stock Opname</h2>
                  <form onSubmit={handleAddAuditLog} className="space-y-4">
                    <div>
                      <label className="block text-xs font-semibold uppercase text-slate-300 mb-1">1. Zona / Lokasi</label>
                      <select value={selectedZone} onChange={(e) => setSelectedZone(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white">
                        {defaultZones.map(z => <option key={z} value={z}>{z}</option>)}
                      </select>
                    </div>

                    <div className="relative">
                      <label className="block text-xs font-semibold uppercase text-slate-300 mb-1">2. SKU Variasi Barang</label>
                      <input type="text" placeholder="Cari Kode SKU / Nama..." value={skuInput} onChange={(e) => { setSkuInput(e.target.value); setSelectedSkuObj(null); setShowSuggestions(true); }} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white" />
                      {showSuggestions && skuSuggestions.length > 0 && (
                        <div className="absolute z-30 left-0 right-0 mt-1 bg-slate-900 border border-slate-700 rounded-xl shadow-2xl max-h-60 overflow-y-auto divide-y divide-slate-800">
                          {skuSuggestions.map(item => (
                            <div key={item.id} onClick={() => handleSelectSku(item)} className="p-2.5 hover:bg-slate-800 cursor-pointer text-xs flex justify-between">
                              <div>
                                <p className="font-mono font-semibold text-blue-400">{item.sku}</p>
                                <p className="text-slate-300">{item.name}</p>
                              </div>
                              <div className="text-emerald-400 font-semibold">{item.systemQty} Pcs</div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>

                    <div>
                      <label className="block text-xs font-semibold uppercase text-slate-300 mb-1">3. Jumlah Fisik & Satuan</label>
                      <div className="grid grid-cols-12 gap-2">
                        <div className="col-span-7">
                          <input type="number" step="any" placeholder="Qty" value={inputQty} onChange={(e) => setInputQty(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-base font-mono font-bold text-white" />
                        </div>
                        <div className="col-span-5">
                          <select value={unit} onChange={(e) => setUnit(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm font-semibold text-white">
                            <option value="Pcs">Pcs</option>
                            <option value="Karung">Karung</option>
                          </select>
                        </div>
                      </div>
                      <div className="mt-2 flex items-center justify-between text-xs text-slate-400 bg-slate-900/60 p-2 rounded-lg border border-slate-800">
                        <span>1 Karung =</span>
                        <input type="number" value={conversionRatio} onChange={(e) => setConversionRatio(Math.max(1, parseInt(e.target.value) || 1))} className="w-16 bg-slate-800 border border-slate-700 rounded text-center py-0.5 text-xs text-white font-mono" />
                      </div>
                      {inputQty > 0 && (
                        <div className="mt-3 bg-emerald-950/30 border border-emerald-500/30 rounded-xl p-3 text-xs text-emerald-300">
                          <span className="font-semibold block">Konversi:</span>
                          <span className="font-mono text-sm font-bold text-white">{convertedValues.displayText}</span>
                        </div>
                      )}
                    </div>

                    <div>
                      <label className="block text-xs font-semibold uppercase text-slate-300 mb-1">Catatan Opname</label>
                      <input type="text" placeholder="Catatan opsional" value={auditorNote} onChange={(e) => setAuditorNote(e.target.value)} className="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm text-white" />
                    </div>

                    <button type="submit" className="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold py-3 rounded-xl shadow-lg shadow-blue-600/30 transition-all">Simpan Audit</button>
                  </form>
                </div>

                <div className="lg:col-span-7 bg-slate-800/90 border border-slate-700/80 rounded-2xl p-5 shadow-xl flex flex-col">
                  <h3 className="text-base font-semibold text-white mb-4">Daftar Hasil Record Opname ({auditLogs.length})</h3>
                  {auditLogs.length === 0 ? (
                    <div className="flex-1 flex flex-col items-center justify-center text-center p-8 border-2 border-dashed border-slate-700 rounded-xl my-4">
                      <p className="text-slate-400 font-medium">Belum ada data fisik yang di-input</p>
                    </div>
                  ) : (
                    <div className="flex-1 overflow-x-auto">
                      <table className="w-full text-left text-xs">
                        <thead className="bg-slate-900/80 text-slate-400 font-mono uppercase border-b border-slate-700">
                          <tr>
                            <th className="p-3">Waktu & Zone</th>
                            <th className="p-3">SKU / Barang</th>
                            <th className="p-3 text-right">Qty Input</th>
                            <th className="p-3 text-right">Hasil Konversi</th>
                            <th className="p-3 text-center">Aksi</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-800">
                          {auditLogs.map(log => (
                            <tr key={log.id} className="hover:bg-slate-700/30">
                              <td className="p-3"><span className="font-semibold text-slate-200">{log.zone}</span><span className="block text-[10px] text-slate-400">{log.timestamp}</span></td>
                              <td className="p-3"><span className="font-mono text-blue-400 font-semibold block">{log.sku}</span><span className="text-slate-300 text-[11px]">{log.name}</span></td>
                              <td className="p-3 text-right font-mono font-bold text-white">{log.inputQty} {log.unit}</td>
                              <td className="p-3 text-right font-mono"><div className="text-emerald-400 font-bold">{log.pcsQty} Pcs</div><div className="text-[11px] text-slate-400">{log.karungQty.toFixed(2)} Karung</div></td>
                              <td className="p-3 text-center"><button onClick={() => handleDeleteAuditLog(log.id)} className="p-1.5 bg-rose-500/10 text-rose-400 rounded-lg hover:bg-rose-500/30">Hapus</button></td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  )}
                </div>
              </div>
            )}

            {activeTab === 'todos' && (
              <div className="space-y-6">
                <div className="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-5 shadow-xl flex justify-between items-center">
                  <h2 className="text-lg font-bold text-white">Audit Task & Planning Schedule</h2>
                  <div className="flex bg-slate-900 p-1.5 rounded-xl border border-slate-700">
                    {['Harian', 'Mingguan', 'Bulanan', 'Tahunan'].map(p => (
                      <button key={p} onClick={() => setTodoPeriod(p)} className={`px-3 py-1.5 rounded-lg text-xs font-semibold ${todoPeriod === p ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400'}`}>{p}</button>
                    ))}
                  </div>
                </div>
                <div className="flex justify-between items-center">
                  <h3 className="text-sm font-semibold text-slate-300">Daftar Tugas ({filteredTodos.length})</h3>
                  <button onClick={() => setShowAddTodoModal(true)} className="bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold px-3 py-2 rounded-xl shadow-md">Tambah Tugas</button>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                  {filteredTodos.map(task => (
                    <div key={task.id} className={`border rounded-2xl p-4 flex flex-col justify-between ${task.completed ? 'bg-slate-900/40 border-slate-800 text-slate-500' : 'bg-slate-800/90 border-slate-700/80 text-white shadow-lg'}`}>
                      <div>
                        <div className="flex items-start justify-between">
                          <div className="flex items-start space-x-2">
                            <input type="checkbox" checked={task.completed} onChange={() => toggleTodo(task.id)} className="w-5 h-5 accent-blue-600 mt-0.5" />
                            <h4 className={`text-sm font-semibold ${task.completed ? 'line-through text-slate-500' : 'text-white'}`}>{task.title}</h4>
                          </div>
                          <button onClick={() => handleDeleteTodo(task.id)} className="text-rose-400 text-xs">Hapus</button>
                        </div>
                        <p className="text-xs text-slate-400 mt-2 pl-7">{task.description}</p>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {activeTab === 'dashboard' && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                  <div className="bg-slate-800/90 border border-slate-700/80 p-4 rounded-2xl shadow-lg">
                    <div className="text-slate-400 text-xs mb-1">Total System Qty</div>
                    <div className="text-2xl font-mono font-bold text-white">{reconciliationData.totalSystemPcs.toLocaleString()} Pcs</div>
                  </div>
                  <div className="bg-slate-800/90 border border-slate-700/80 p-4 rounded-2xl shadow-lg">
                    <div className="text-slate-400 text-xs mb-1">Total Fisik (Audited)</div>
                    <div className="text-2xl font-mono font-bold text-emerald-400">{reconciliationData.totalAuditedPcs.toLocaleString()} Pcs</div>
                  </div>
                  <div className="bg-slate-800/90 border border-slate-700/80 p-4 rounded-2xl shadow-lg">
                    <div className="text-slate-400 text-xs mb-1">Net Selisih (Varian)</div>
                    <div className={`text-2xl font-mono font-bold ${reconciliationData.netDiscrepancy < 0 ? 'text-rose-400' : 'text-emerald-400'}`}>
                      {reconciliationData.netDiscrepancy > 0 ? `+${reconciliationData.netDiscrepancy}` : reconciliationData.netDiscrepancy} Pcs
                    </div>
                  </div>
                  <div className="bg-slate-800/90 border border-slate-700/80 p-4 rounded-2xl shadow-lg">
                    <div className="text-slate-400 text-xs mb-1">SKU Bermasalah</div>
                    <div className="text-2xl font-mono font-bold text-amber-400">{reconciliationData.totalDiscrepanciesCount} SKU</div>
                  </div>
                </div>

                <div className="bg-amber-950/40 border border-amber-500/40 rounded-2xl p-5 shadow-xl">
                  <div className="text-amber-400 font-bold mb-3 text-sm">Notifikasi & Alert Selisih Stok Utama (Discrepancy Alerts)</div>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                    {reconciliationData.items.filter(i => i.discrepancyPcs !== 0).map(item => (
                      <div key={item.id} className="bg-slate-900 border border-amber-500/30 p-3 rounded-xl flex items-center justify-between">
                        <div>
                          <span className="font-mono text-xs font-bold text-amber-300 block">{item.sku}</span>
                          <span className="text-xs text-slate-300">{item.name}</span>
                        </div>
                        <div className="text-right">
                          <span className={`text-xs font-mono font-bold px-2 py-1 rounded ${item.discrepancyPcs < 0 ? 'bg-rose-500/20 text-rose-300' : 'bg-emerald-500/20 text-emerald-300'}`}>
                            Selisih: {item.discrepancyPcs > 0 ? `+${item.discrepancyPcs}` : item.discrepancyPcs} Pcs
                          </span>
                        </div>
                      </div>
                    ))}
                    {reconciliationData.totalDiscrepanciesCount === 0 && (
                      <p className="text-xs text-slate-400 italic col-span-2">Tidak ada selisih stok terdeteksi saat ini.</p>
                    )}
                  </div>
                </div>

                <div className="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-5 shadow-xl overflow-x-auto">
                  <h3 className="text-sm font-semibold text-white mb-4">Tabel Perbandingan Stok System vs Stok Fisik</h3>
                  <table className="w-full text-left text-xs">
                    <thead className="bg-slate-900 text-slate-400 uppercase font-mono border-b border-slate-700">
                      <tr>
                        <th className="p-3">SKU Variasi</th>
                        <th className="p-3">Nama & Detail Produk</th>
                        <th className="p-3 text-right">System Qty</th>
                        <th className="p-3 text-right">Fisik (Pcs)</th>
                        <th className="p-3 text-right">Fisik (Karung)</th>
                        <th className="p-3 text-right">Selisih Pcs</th>
                        <th className="p-3 text-center">Status</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800">
                      {reconciliationData.items.map(item => (
                        <tr key={item.id} className="hover:bg-slate-700/30">
                          <td className="p-3 font-mono font-bold text-blue-400">{item.sku}</td>
                          <td className="p-3 text-slate-300">{item.name}</td>
                          <td className="p-3 text-right font-mono text-white">{item.systemQty} Pcs</td>
                          <td className="p-3 text-right font-mono text-emerald-400 font-bold">{item.physicalQty} Pcs</td>
                          <td className="p-3 text-right font-mono text-slate-300">{(item.physicalQty / (item.conversionRatio || 50)).toFixed(2)} Karung</td>
                          <td className="p-3 text-right font-mono font-bold"><span className={item.discrepancyPcs < 0 ? 'text-rose-400' : item.discrepancyPcs > 0 ? 'text-amber-400' : 'text-slate-400'}>{item.discrepancyPcs > 0 ? `+${item.discrepancyPcs}` : item.discrepancyPcs}</span></td>
                          <td className="p-3 text-center"><span className={`px-2 py-0.5 rounded text-[10px] font-bold ${item.status === 'MATCHED' ? 'bg-emerald-500/20 text-emerald-300' : item.status === 'SHORTAGE' ? 'bg-rose-500/20 text-rose-300' : 'bg-amber-500/20 text-amber-300'}`}>{item.status}</span></td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}

            {activeTab === 'export' && (
              <div className="max-w-4xl mx-auto space-y-6">
                <div className="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-6 shadow-xl">
                  <div className="flex items-center justify-between mb-4">
                    <div>
                      <h2 className="text-base font-bold text-white">Download Template Excel Native (.xls / .xlsx)</h2>
                      <p className="text-xs text-slate-400">Unduh file template berformat rapi (Header Biru, Border Tegas & Zebra Striping)</p>
                    </div>
                    <span className="bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 text-xs px-3 py-1 rounded-full font-mono font-bold">
                      {masterStock.length} SKU Master Tersedia
                    </span>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                    <div className="bg-slate-900/80 border border-indigo-500/30 rounded-xl p-4 flex flex-col justify-between">
                      <div>
                        <span className="text-indigo-300 text-xs font-bold block mb-2">Template 1: Data Master</span>
                        <p className="text-[11px] text-slate-400 mb-3 leading-relaxed">Kolom: Nama Produk, Variasi Warna, Variasi Ukuran, SKU Induk, SKU Variasi, Sales Rata2/Bulan, Kategori Moving, Harga, Kategori Harga.</p>
                      </div>
                      <button onClick={handleDownloadMasterTemplate} className="w-full bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold py-2.5 rounded-lg shadow-md transition-all">Download Template Master</button>
                    </div>

                    <div className="bg-slate-900/80 border border-blue-500/30 rounded-xl p-4 flex flex-col justify-between">
                      <div>
                        <span className="text-blue-300 text-xs font-bold block mb-2">Template 2: Data Qty Stok ({masterStock.length} SKU)</span>
                        <p className="text-[11px] text-slate-400 mb-3 leading-relaxed">Secara otomatis memuat seluruh {masterStock.length} SKU yang ada di Master Data saat ini untuk memperbarui Qty System & Rasio Karung.</p>
                      </div>
                      <button onClick={handleDownloadQtyTemplate} className="w-full bg-blue-600 hover:bg-blue-500 text-white text-xs font-semibold py-2.5 rounded-lg shadow-md transition-all">Download Template Qty Stok</button>
                    </div>
                  </div>
                </div>

                <div className="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-6 shadow-xl relative">
                  <h2 className="text-base font-bold text-white mb-2">Import File Excel</h2>
                  <p className="text-xs text-slate-400 mb-4">Pilih opsi import data master atau opsi input Qty stok saja</p>

                  <div className="flex bg-slate-900 p-1 rounded-xl border border-slate-700 mb-4">
                    <button onClick={() => setImportMode('master')} className={`flex-1 py-2 text-xs font-semibold rounded-lg transition-all ${importMode === 'master' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>Option 1: Import Data Master</button>
                    <button onClick={() => setImportMode('qty')} className={`flex-1 py-2 text-xs font-semibold rounded-lg transition-all ${importMode === 'qty' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-400 hover:text-white'}`}>Option 2: Import Qty Stok Saja</button>
                  </div>

                  <div className="border-2 border-dashed border-slate-700 rounded-xl p-6 text-center hover:border-blue-500 transition-colors">
                    <input type="file" accept=".xlsx, .xls, .csv" onChange={handleFileUpload} className="hidden" id="excel-upload-input" />
                    <label htmlFor="excel-upload-input" className="cursor-pointer flex flex-col items-center">
                      <span className="text-sm font-semibold text-blue-400">Upload Excel: {importMode === 'master' ? 'Data Master' : 'Data Qty Stok'}</span>
                      <span className="text-xs text-slate-500 mt-1">Format .xlsx, .xls, atau .csv didukung</span>
                    </label>
                  </div>

                  {isProcessingFile && (
                    <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
                      <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-6 shadow-2xl text-center space-y-3">
                        <h3 className="text-base font-bold text-white">Proses Upload Excel</h3>
                        <p className="text-xs text-slate-400">{uploadStatusMsg}</p>
                        <div className="w-full bg-slate-800 rounded-full h-3 overflow-hidden p-0.5 border border-slate-700">
                          <div className="bg-blue-600 h-full rounded-full transition-all duration-300" style={{ width: `${uploadProgress}%` }}></div>
                        </div>
                      </div>
                    </div>
                  )}
                </div>

                <div className="bg-slate-800/90 border border-slate-700/80 rounded-2xl p-6 shadow-xl">
                  <h2 className="text-base font-bold text-white mb-1">Export Laporan Opname ke Excel</h2>
                  <p className="text-xs text-slate-400 mb-4">Unduh hasil audit fisik terlengkap dengan konversi otomatis Pcs ke Karung & Varian</p>
                  <button onClick={handleExportToExcel} className="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl shadow-lg shadow-emerald-600/35 transition-all">Download Laporan Excel Bergaya (.xls / .xlsx)</button>
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
